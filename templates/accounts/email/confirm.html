<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فعّل حسابك في نسّاخ</title>
</head>
<body style="margin:0;padding:0;background:#f7f7f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f8;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e8e8eb;border-radius:10px;">
          <tr>
            <td dir="rtl" style="padding:28px;font-family:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.7;color:#18181b;text-align:right;">
              <p style="margin:0 0 16px;font-size:18px;font-weight:600;">نسّاخ</p>
              <p style="margin:0 0 12px;">مرحبًا {{ name }}،</p>
              <p style="margin:0 0 20px;">حسابك جاهز؛ يبقى تفعيله.</p>
              <p style="margin:0 0 24px;">
                <a href="{{ link }}" style="display:inline-block;padding:10px 18px;border-radius:8px;background:#18181b;color:#ffffff;text-decoration:none;font-weight:500;">تفعيل الحساب</a>
              </p>
              <p style="margin:0 0 6px;font-size:13px;color:#56565f;">أو انسخ هذا الرابط إلى المتصفح:</p>
              <p dir="ltr" style="margin:0 0 20px;font-size:12px;color:#56565f;word-break:break-all;text-align:left;">{{ link }}</p>
              <p style="margin:0;font-size:13px;color:#8a8a93;">الرابط صالح {{ days }}. إن لم تطلب هذا الحساب فتجاهل الرسالة.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
