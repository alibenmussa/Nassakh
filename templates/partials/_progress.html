{# Progress bar (DESIGN.md §6): 4px track, `thin` → 3px. Context: percent (0-100); optional label (aria-label), state (success|danger|warning|neutral) for the fill colour. From counts use the tag: {% load nassakh %}{% progress_bar value=done total=all %}. #}
<div class="progress{% if thin %} progress-thin{% endif %}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ percent|default:0 }}"{% if label %} aria-label="{{ label }}"{% endif %}><div class="progress-fill{% if state %} is-{{ state }}{% endif %}" style="width: {{ percent|default:0 }}%"></div></div>
