{% comment %}One stacked sheet of the dashboard's «صفحات» view (docs/DASHBOARD_SPEC.md §3): a static shell —
server-rendered for every page at first paint, and once more with `t` = None inside <template id="sheet-shell">
for pages ingested after load (books.js clones and patches it). No per-shell Alpine bindings: books.js patches
the head (`patchSheet`) from the poll's changed set; the body mounts from <template id="sheet-body"> only while
the sheet is near the viewport. Context: t (tile dict or None), book, role, request.{% endcomment %}
<article class="page-sheet{% if t.is_excluded %} is-excluded{% endif %}{% if t.error %} is-error{% endif %}"{% if t %} id="sheet-{{ t.number }}" data-page-id="{{ t.id }}" data-number="{{ t.number }}" data-status="{{ t.status }}" data-text="{{ t.text_state }}"{% else %} data-page-id="" data-number="" data-status="" data-text=""{% endif %} style="--sheet-ar: {% if t.width and t.height %}{{ t.width }} / {{ t.height }}{% else %}7 / 10{% endif %}">
  <header class="sheet-head">
    <a class="sheet-title num" href="{{ t.url }}">صفحة <bdi>{{ t.number }}</bdi></a>
    <span class="status"><span class="dot {{ t.dot|default:'dot-neutral' }}" aria-hidden="true"></span><span class="sheet-status">{{ t.status_label }}</span></span>
    <span class="badge bk-provisional"{% if t.text_state != 'provisional' %} hidden{% endif %}>نص مبدئي</span>
    <span class="meta num sheet-printed"{% if not t.printed_number %} hidden{% endif %}>الرقم المطبوع <bdi>{{ t.printed_number }}</bdi></span>
    <span class="badge badge-warning num sheet-unresolved"{% if t.is_reviewed or not t.n_unresolved %} hidden{% endif %} title="كلمات غير مؤكَّدة تنتظر المراجعة"><bdi>{{ t.n_unresolved|default:0 }}</bdi> غير مؤكَّدة</span>
    <span class="bk-reviewed"{% if not t.is_reviewed %} hidden{% endif %}><span class="bk-mark" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span><span>مُراجَعة</span></span>
    <span class="badge badge-dark sheet-excluded"{% if not t.is_excluded %} hidden{% endif %}>مستثناة</span>
    <span class="sheet-flags">{% for label in t.flag_labels %}<span class="badge badge-warning">{{ label }}</span>{% endfor %}{% if t.sequence_issue %}<span class="badge badge-warning num">{{ t.sequence_issue }}</span>{% endif %}</span>
    <span class="sheet-actions">
      <a class="btn btn-ghost btn-sm sheet-review" href="{{ t.review_url }}"{% if t.text_state != 'final' or t.is_excluded %} hidden{% endif %}>مراجعة</a>
      <button type="button" class="btn btn-ghost btn-sm sheet-copy" hidden aria-label="نسخ نص الصفحة {{ t.number }}" title="نسخ نص الصفحة (C)">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-copy"/></svg>
        <span>نسخ</span>
      </button>
      {% if role == 'admin' or role == 'editor' %}
      <form method="post" class="sheet-retry" action="{{ t.rerun_url }}"{% if not t.error or not t.retry_stage %} hidden{% endif %}>
        {% csrf_token %}
        <input type="hidden" name="stage" value="{{ t.retry_stage }}">
        <input type="hidden" name="next" value="{% url 'books:detail' book.pk %}">
        <button type="submit" class="btn btn-sm">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-refresh"/></svg>
          <span>إعادة <span class="sheet-retry-label">{{ t.retry_label }}</span></span>
        </button>
      </form>
      {% endif %}
    </span>
  </header>
  <div class="sheet-body"></div>
</article>
