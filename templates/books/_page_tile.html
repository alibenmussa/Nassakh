{% comment %}One dashboard grid tile (docs/baseline/DASHBOARD_SPEC.md §7): a static card, server-rendered for every page and
once more with `t` = None inside <template id="tile-shell"> for pages ingested after load. books.js patches it
(`patchTile`) from the poll; its effects (sweep while cleaning, reading line while OCR runs) are CSS animations that
run only while the grid is active and the tile is near the viewport. Muted palette: the stage bar is dark gray and
turns accent only as it reaches 100 %; marks are the review filmstrip's. Footer: number + status dot, the label in
the link's title; a half-disc before the dot marks a page one model read (D73, `t.readers`, patched by
`patchReader`). In the «التخطيط» mode (PHASE7 §3.12) the thumbnail carries the page's bands (`.gd-bands`, patched by
`patchTileGuides`) and an amber mark on the pages worth a look. D76 (PHASE7 §5.4): the link's address is the page's
`primary_url` (review once its text is final, else the page's sheet in «التخطيط», D84), so a new tab or a
modifier-click reaches review; a plain click still opens the viewer (D33). On hover (always on touch) «مراجعة»
opens review. Context: t (tile dict or None), book, role, request, guides_mode.{% endcomment %}
<div class="page-tile{% if t.is_excluded %} is-excluded{% endif %}{% if t.error %} is-error{% endif %}"{% if t %} data-page-id="{{ t.id }}" data-number="{{ t.number }}" data-status="{{ t.status }}"{% else %} data-page-id="" data-number="" data-status=""{% endif %}>
  <a class="page-tile-link" href="{% firstof t.primary_url t.url %}" title="الصفحة {{ t.number }} — {{ t.status_label }}" aria-label="الصفحة {{ t.number }} — {{ t.status_label }}">
    <span class="page-tile-thumb">
      <span class="page-tile-placeholder"{% if t.thumb_url or t.scan_thumb_url %} hidden{% endif %} aria-hidden="true">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#i-image"/></svg>
      </span>
      <img class="page-tile-img page-tile-scan"{% if t.scan_thumb_url %} src="{{ t.scan_thumb_url }}"{% else %} hidden{% endif %} alt="" loading="lazy" decoding="async">
      <img class="page-tile-img page-tile-clean{% if t.thumb_url %} is-ready{% endif %}"{% if t.thumb_url %} src="{{ t.thumb_url }}"{% else %} hidden{% endif %} alt="" loading="lazy" decoding="async">
      {% if guides_mode %}<span class="gd-bands" aria-hidden="true"></span><span class="tile-mark-doubt" hidden title="تستحق نظرة"><span class="sr-only">تستحق نظرة</span></span>{% endif %}
      <span class="page-tile-flag badge badge-dark num"{% if not t.n_flags %} hidden{% endif %} title="{% if t.flag_labels %}{{ t.flag_labels|join:'، ' }}{% endif %}">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-flag"/></svg>
        <span class="tile-nflags">{{ t.n_flags|default:0 }}</span>
      </span>
      <span class="page-tile-excluded badge badge-dark"{% if not t.is_excluded %} hidden{% endif %}>مستثناة</span>
      <span class="bk-mark-check tile-mark-check"{% if not t.is_reviewed %} hidden{% endif %} title="صفحة مُراجَعة"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span class="sr-only">مُراجَعة</span></span>
      <span class="bk-mark-count tile-mark-count"{% if t.is_reviewed or not t.n_unresolved %} hidden{% endif %} title="علامات لم تُحسم: {{ t.n_unresolved|default:0 }}">{{ t.n_unresolved|default:0 }}</span>
      <span class="tile-stage{% if t.error %} is-error{% endif %}{% if t.is_excluded or t.status == 'ocr_done' or t.status == 'reviewed' or t.status == 'assembled' %} is-done{% endif %}" aria-hidden="true"><span class="tile-stage-fill" style="width: {% if t.error or t.status == 'ocr_done' or t.status == 'reviewed' or t.status == 'assembled' %}100{% elif t.status == 'layout_done' %}72{% elif t.status == 'preprocessed' %}46{% elif t.status == 'uploaded' %}12{% else %}0{% endif %}%"></span></span>
    </span>
    <span class="page-tile-footer">
      <span class="tile-number num">{{ t.number }}</span>
      <span class="page-tile-marks">{% if t.readers == 'one' %}<span class="mark-reader" title="قراءة واحدة"><span class="sr-only">قراءة واحدة</span></span>{% elif t.readers == 'tesseract' %}<span class="mark-reader is-tesseract" title="نص Tesseract وحده"><span class="sr-only">نص Tesseract وحده</span></span>{% else %}<span class="mark-reader" hidden><span class="sr-only">قراءة واحدة</span></span>{% endif %}<span class="dot {{ t.dot|default:'dot-neutral' }}" aria-hidden="true"></span></span>
    </span>
  </a>
  {% if not guides_mode %}
  <span class="page-tile-actions">
    <a class="btn btn-sm page-tile-review" href="{{ t.review_url }}"{% if t.text_state != 'final' or t.is_excluded %} hidden{% endif %}{% if t %} aria-label="مراجعة الصفحة {{ t.number }}"{% endif %}>مراجعة</a>
  </span>
  {% endif %}
  {% if role == 'admin' or role == 'editor' %}
  <form method="post" class="page-tile-toggle" action="{% if t %}{% url 'books:toggle_exclude' book.pk t.number %}{% endif %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{% if guides_mode %}{{ request.get_full_path }}{% else %}{{ request.path }}{% endif %}">
    <button type="submit" class="btn-icon btn-icon-sm tile-toggle" title="{% if t.is_excluded %}إعادة الصفحة إلى الكتاب{% else %}استثناء الصفحة من الكتاب{% endif %}" aria-label="{% if t.is_excluded %}إعادة الصفحة {{ t.number }} إلى الكتاب{% else %}استثناء الصفحة {{ t.number }} من الكتاب{% endif %}">
      <svg class="icon tile-icon-exclude"{% if t.is_excluded %} hidden{% endif %} aria-hidden="true"><use href="#i-eye-off"/></svg>
      <svg class="icon tile-icon-restore"{% if not t.is_excluded %} hidden{% endif %} aria-hidden="true"><use href="#i-eye"/></svg>
    </button>
  </form>
  {% endif %}
</div>
